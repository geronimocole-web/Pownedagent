name: Deploy naar Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ── Tests ──────────────────────────────────────────────
  test:
    name: Tests draaien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Dependencies installeren
        run: pnpm install --frozen-lockfile

      - name: Tests draaien
        run: pnpm test

  # ── Deploy naar Vercel ────────────────────────────────
  deploy-preview:
    name: Preview deploy (PR)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Vercel CLI installeren
        run: npm install -g vercel@latest

      - name: Vercel preview deployen
        run: vercel --token=${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    name: Productie deploy (main)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Vercel CLI installeren
        run: npm install -g vercel@latest

      - name: Vercel productie deployen
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

      # ── Database migraties ────────────────────────────
      - name: Supabase CLI installeren
        run: npm install -g supabase@latest

      - name: Database migraties uitvoeren
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" \
            packages/database/schema.sql
